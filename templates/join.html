<!DOCTYPE html>
<html>
<head>
    <title>Join CSV Files</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='join.css') }}" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Navigation Bar -->
        <div class="nav-bar">
            <a href="{{ url_for('index') }}" class="nav-button preprocessing">
                Preprocessing
            </a>
            <a href="{{ url_for('mapping') }}" class="nav-button mapping">
                Mapping
            </a>
            <a href="{{ url_for('calculation') }}" class="nav-button calculation">
                Calculation
            </a>
        </div>

        <!-- Main Content -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h1 class="text-2xl font-bold mb-6">Join CSV Files</h1>
            
            <form id="uploadForm" action="/process-join" method="POST" enctype="multipart/form-data" class="space-y-4">
                <div id="fileInputs" class="space-y-4">
                    <div class="file-input-group flex items-center space-x-4">
                        <input type="file" name="files[]" accept=".csv" class="p-2 border rounded" required>
                        <button type="button" class="remove-file text-red-500 hover:text-red-700" style="display: none;">
                            Remove
                        </button>
                    </div>
                </div>
                
                <div class="flex space-x-4 mt-4">
                    <button type="button" id="addFile" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition-colors">
                        + Add Another File
                    </button>
                    
                    <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 transition-colors">
                        Join Files
                    </button>
                </div>
            </form>
            
            <div id="preview" class="preview-section hidden">
                <div class="preview-header">
                    <h2 class="preview-title">Preview of Combined Data</h2>
                </div>
                
                <div id="previewStats" class="preview-stats">
                    <div class="stat-item">
                        <span class="stat-label">Total Rows</span>
                        <span id="totalRows" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Total Columns</span>
                        <span id="totalColumns" class="stat-value">0</span>
                    </div>
                </div>

                <div class="preview-table-wrapper">
                    <table id="previewTable" class="preview-table">
                        <thead>
                            <tr id="tableHeaders"></tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                
                <div class="action-buttons">
                    <button id="downloadCsvBtn" class="btn btn-download">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                        </svg>
                        Download CSV
                    </button>
                    
                    <button id="downloadPdfBtn" class="btn btn-pdf">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        Download PDF
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='join.js') }}"></script>
</body>
</html>
