<!DOCTYPE html>
<html>
<head>
    <title>Join CSV Files</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='join.css') }}" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6">Join CSV Files</h1>
        
        <form id="uploadForm" action="/process-join" method="POST" enctype="multipart/form-data" class="space-y-4">
            <div id="fileInputs" class="space-y-4">
                <div class="file-input-group flex items-center space-x-4">
                    <input type="file" name="files[]" accept=".csv" class="p-2 border rounded" required>
                    <button type="button" class="remove-file text-red-500 hover:text-red-700" style="display: none;">
                        Remove
                    </button>
                </div>
            </div>
            
            <div class="flex space-x-4 mt-4">
                <button type="button" id="addFile" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition-colors">
                    + Add Another File
                </button>
                
                <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 transition-colors">
                    Join Files
                </button>
            </div>
        </form>
        
        <div id="preview" class="preview-section hidden">
            <div class="preview-header">
                <h2 class="preview-title">Preview of Combined Data</h2>
            </div>
            
            <div id="previewStats" class="preview-stats">
                <div class="stat-item">
                    <span class="stat-label">Total Rows</span>
                    <span id="totalRows" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total Columns</span>
                    <span id="totalColumns" class="stat-value">0</span>
                </div>
            </div>

            <div class="preview-table-wrapper">
                <table id="previewTable" class="preview-table">
                    <thead>
                        <tr id="tableHeaders"></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            
            <div class="action-buttons">
                <button id="downloadCsvBtn" class="btn btn-download">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                    </svg>
                    Download CSV
                </button>
                
                <button id="downloadPdfBtn" class="btn btn-pdf">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    Download PDF
                </button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('addFile').addEventListener('click', function() {
            const fileInputs = document.getElementById('fileInputs');
            const newGroup = document.createElement('div');
            newGroup.className = 'file-input-group flex items-center space-x-4';
            
            newGroup.innerHTML = `
                <input type="file" name="files[]" accept=".csv" class="p-2 border rounded" required>
                <button type="button" class="remove-file text-red-500 hover:text-red-700">
                    Remove
                </button>
            `;
            
            fileInputs.appendChild(newGroup);
            
            // Show all remove buttons when there's more than one file input
            const removeButtons = document.querySelectorAll('.remove-file');
            removeButtons.forEach(button => button.style.display = 'block');
        });

        document.getElementById('fileInputs').addEventListener('click', function(e) {
            if (e.target.classList.contains('remove-file')) {
                e.target.parentElement.remove();
                
                // Hide remove button if only one file input remains
                const fileInputs = document.querySelectorAll('.file-input-group');
                if (fileInputs.length === 1) {
                    fileInputs[0].querySelector('.remove-file').style.display = 'none';
                }
            }
        });

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            try {
                const response = await fetch('/process-join', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('preview').classList.remove('hidden');
                    
                    // Update stats
                    document.getElementById('totalRows').textContent = result.total_rows;
                    document.getElementById('totalColumns').textContent = result.columns.length;
                    
                    // Update table headers
                    const headerRow = document.getElementById('tableHeaders');
                    headerRow.innerHTML = result.columns.map(col => `<th>${col}</th>`).join('');
                    
                    // Update table body with preview data
                    const tableBody = document.getElementById('tableBody');
                    const previewData = result.preview.split('\n').slice(1); // Skip header row
                    tableBody.innerHTML = previewData.map(row => {
                        const cells = row.trim().split(/\s+/);
                        return `<tr>${cells.map(cell => `<td>${cell}</td>`).join('')}</tr>`;
                    }).join('');
                    
                    // Setup download buttons
                    const downloadCsvBtn = document.getElementById('downloadCsvBtn');
                    downloadCsvBtn.onclick = () => window.location.href = `/download/${result.filename}`;
                    
                    const downloadPdfBtn = document.getElementById('downloadPdfBtn');
                    if (result.pdf_filename) {
                        downloadPdfBtn.onclick = () => window.location.href = `/download/${result.pdf_filename}`;
                        downloadPdfBtn.classList.remove('hidden');
                    } else {
                        downloadPdfBtn.classList.add('hidden');
                    }
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error processing files: ' + error);
            }
        });
    </script>
</body>
</html>
