<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join CSV Files</title>
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="app-header">
        <div class="nav-container">
            <div class="nav-tabs">
                <a href="{{ url_for('index') }}" class="nav-tab preprocessing">
                    <i class="fas fa-cogs me-2"></i>Preprocessing
                </a>
                <a href="{{ url_for('join') }}" class="nav-tab join">
                    <i class="fas fa-link me-2"></i>Join Files
                </a>
                <a href="{{ url_for('mapping.mapping_page') }}" class="nav-tab mapping">
                    <i class="fas fa-map me-2"></i>Mapping
                </a>
                <a href="{{ url_for('calculation') }}" class="nav-tab calculation">
                    <i class="fas fa-calculator me-2"></i>Calculation
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <h2 class="page-title">Join CSV Files</h2>
            <p class="mb-4">Upload multiple CSV files to combine them into one file.</p>
            
            <!-- Upload Form -->
            <form id="uploadForm" action="/process-join" method="POST" enctype="multipart/form-data">
                <div id="fileInputs" class="mb-4">
                    <div class="file-input-group">
                        <div class="upload-area" id="dropZone1">
                            <div class="upload-icon">
                                <i class="fas fa-cloud-upload-alt"></i>
                            </div>
                            <p>Drag and drop CSV file here or click to select</p>
                            <p class="small text-muted">File 1</p>
                            <input type="file" id="fileInput1" name="files[]" accept=".csv" class="hidden" required>
                        </div>
                        <button type="button" class="remove-file hidden">
                            <i class="fas fa-trash-alt"></i> Remove
                        </button>
                    </div>
                </div>
                
                <div class="mb-4 d-flex gap-3">
                    <button type="button" id="addFile" class="btn btn-primary">
                        <i class="fas fa-plus me-2"></i>Add Another File
                    </button>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-object-group me-2"></i>Join Files
                    </button>
                </div>
            </form>

            <!-- Preview Section -->
            <div id="preview" class="mt-4 hidden">
                <h3 class="section-title">
                    <i class="fas fa-eye me-2"></i>Preview of Combined Data
                </h3>
                
                <!-- Preview Stats -->
                <div id="previewStats" class="preview-stats">
                    <div class="stat-item">
                        <i class="fas fa-table me-2"></i>
                        <span class="stat-label">Total Rows:</span>
                        <span id="totalRows" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-columns me-2"></i>
                        <span class="stat-label">Total Columns:</span>
                        <span id="totalColumns" class="stat-value">0</span>
                    </div>
                </div>

                <!-- Preview Table -->
                <div class="preview-container">
                    <div class="table-responsive">
                        <table id="previewTable" class="table">
                            <thead>
                                <tr id="tableHeaders">
                                    <!-- Dynamically Generated Headers -->
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <!-- Dynamically Generated Data -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Download Buttons -->
                <div class="nav-buttons">
                    <div></div> <!-- Empty div for flex spacing -->
                    <div class="d-flex gap-3">
                        <a id="downloadCsvBtn" href="#" class="btn btn-success hidden">
                            <i class="fas fa-file-csv me-2"></i>Download CSV
                        </a>
                        <a id="downloadPdfBtn" href="#" class="btn btn-danger hidden">
                            <i class="fas fa-file-pdf me-2"></i>Download PDF
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const fileInputs = document.getElementById('fileInputs');
        const addFileButton = document.getElementById('addFile');
        const preview = document.getElementById('preview');
        const previewTable = document.getElementById('previewTable');
        const previewStats = document.getElementById('previewStats');
        const totalRows = document.getElementById('totalRows');
        const totalColumns = document.getElementById('totalColumns');
        const downloadCsvBtn = document.getElementById('downloadCsvBtn');
        const downloadPdfBtn = document.getElementById('downloadPdfBtn');
        
        // Initialize drag and drop for the first upload area
        initializeDragAndDrop('dropZone1', 'fileInput1');
        
        // Function to initialize drag and drop functionality
        function initializeDragAndDrop(dropZoneId, fileInputId) {
            const dropZone = document.getElementById(dropZoneId);
            const fileInput = document.getElementById(fileInputId);
            
            // Open file dialog when clicking on the drop zone
            dropZone.addEventListener('click', () => {
                fileInput.click();
            });
            
            // Display file name when a file is selected
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) {
                    const fileName = fileInput.files[0].name;
                    dropZone.querySelector('p').textContent = `Selected: ${fileName}`;
                    dropZone.style.borderColor = 'var(--success-color)';
                }
            });
            
            // Handle drag and drop events
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = 'var(--primary-color)';
                dropZone.style.backgroundColor = 'rgba(67, 97, 238, 0.05)';
            });
            
            dropZone.addEventListener('dragleave', () => {
                dropZone.style.borderColor = 'var(--medium-gray)';
                dropZone.style.backgroundColor = 'var(--secondary-color)';
            });
            
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = 'var(--success-color)';
                dropZone.style.backgroundColor = 'var(--secondary-color)';
                
                if (e.dataTransfer.files.length > 0) {
                    fileInput.files = e.dataTransfer.files;
                    const fileName = fileInput.files[0].name;
                    dropZone.querySelector('p').textContent = `Selected: ${fileName}`;
                    
                    // Trigger change event
                    const event = new Event('change');
                    fileInput.dispatchEvent(event);
                }
            });
        }
        
        // Add new file input with drag and drop functionality
        let fileCounter = 2;
        addFileButton.addEventListener('click', () => {
            const fileInputGroup = document.createElement('div');
            fileInputGroup.classList.add('file-input-group');
            
            const dropZoneId = `dropZone${fileCounter}`;
            const fileInputId = `fileInput${fileCounter}`;
            
            fileInputGroup.innerHTML = `
                <div class="upload-area" id="${dropZoneId}">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <p>Drag and drop CSV file here or click to select</p>
                    <p class="small text-muted">File ${fileCounter}</p>
                    <input type="file" id="${fileInputId}" name="files[]" accept=".csv" class="hidden" required>
                </div>
                <button type="button" class="remove-file">
                    <i class="fas fa-trash-alt"></i> Remove
                </button>
            `;
            fileInputs.appendChild(fileInputGroup);

            // Initialize drag and drop for the new upload area
            initializeDragAndDrop(dropZoneId, fileInputId);
            
            const removeButton = fileInputGroup.querySelector('.remove-file');
            removeButton.classList.remove('hidden');
            removeButton.addEventListener('click', () => {
                fileInputGroup.remove();
            });
            
            fileCounter++;
        });

        // Handle form submission and display preview
        const form = document.getElementById('uploadForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData
            });
            const result = await response.json();

            if (result.success) {
                // Update preview stats
                preview.classList.remove('hidden');
                totalRows.textContent = result.total_rows;
                totalColumns.textContent = result.columns.length;

                // Populate table headers
                const headersRow = document.getElementById('tableHeaders');
                headersRow.innerHTML = '';
                result.columns.forEach(col => {
                    const th = document.createElement('th');
                    th.textContent = col;
                    headersRow.appendChild(th);
                });

                // Populate table body
                const tableBody = document.getElementById('tableBody');
                tableBody.innerHTML = '';
                result.preview.forEach(row => {
                    const tr = document.createElement('tr');
                    Object.values(row).forEach(cell => {
                        const td = document.createElement('td');
                        td.textContent = cell;
                        tr.appendChild(td);
                    });
                    tableBody.appendChild(tr);
                });

                // Show download buttons
                downloadCsvBtn.href = `/uploads/${result.filename}`;
                downloadCsvBtn.classList.remove('hidden');
                downloadPdfBtn.href = `/uploads/${result.pdf_filename}`;
                downloadPdfBtn.classList.remove('hidden');
            } else {
                alert(`Error: ${result.error}`);
            }
        });
    </script>
</body>
</html>
