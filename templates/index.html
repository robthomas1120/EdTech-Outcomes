<!DOCTYPE html>
<html lang="en">
<head>
    <script src="{{ url_for('static', filename='index.js') }}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Processor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: white;
            padding: 10px 0;
        }

        .nav-back {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-back:hover {
            background-color: #e9ecef;
        }

        .nav-next {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-next:hover {
            background-color: #0056b3;
        }

        .main-content {
            margin-top: 20px;
        }

        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 5px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            border-color: #666;
        }
        .preview-area {
            margin-top: 20px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            background: #fff;
        }
        .split-view {
            display: flex;
            gap: 20px;
        }
        .preview-section {
            flex: 1;
            max-height: 600px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .preview-container {
            flex: 1;
            overflow: auto;
            min-height: 0;
            border: 1px solid #dee2e6;
            border-radius: 4px;
        }
        .preview-table-wrapper {
            width: 100%;
        }
        .preview-table-wrapper table {
            width: 100%;
            border-collapse: collapse;
        }
        .preview-table-wrapper thead th {
            position: sticky;
            top: 0;
            background: #f8f9fa;
            z-index: 1;
            border-bottom: 2px solid #dee2e6;
            padding: 12px;
            text-align: left;
        }
        .preview-table-wrapper td, .unique-values-table td {
            padding: 8px 12px;
            border: 1px solid #dee2e6;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .row-number {
            width: 50px;
            background-color: #f8f9fa;
            text-align: center;
            font-weight: 500;
            color: #666;
        }
        .preview-table-wrapper tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .preview-table-wrapper tr:hover {
            background-color: #f2f2f2;
        }
        .hidden {
            display: none;
        }
        .row-count {
            padding: 10px;
            font-size: 0.9em;
            color: #666;
            border-bottom: 1px solid #dee2e6;
        }
        .section-title {
            margin-bottom: 10px;
            font-weight: 500;
        }
        .unique-values-section {
            flex: 1;
            max-height: 600px;
        }
        .unique-values-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }
        .unique-values-column {
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 15px;
            background: white;
        }
        .unique-values-column h5 {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #dee2e6;
        }
        .unique-values-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .unique-values-list .p-2 {
            padding: 8px;
            border-bottom: 1px solid #f0f0f0;
        }
        .unique-values-list .p-2:last-child {
            border-bottom: none;
        }
        .format-errors {
            margin-top: 10px;
            padding: 10px;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
        }
        .format-errors ul {
            margin: 0;
            padding-left: 20px;
        }
        .format-errors li {
            color: #856404;
            margin-bottom: 5px;
        }
        .text-input-section {
            margin-bottom: 20px;
        }
        .text-input-section label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .text-input-section .input-group {
            display: flex;
            gap: 10px;
        }
        .text-input-section .form-control {
            flex: 1;
        }
        .format-error {
            background-color: #ffebee;
        }
        .format-error-row {
            background-color: #ffebee !important;
        }
        .format-error-row:hover {
            background-color: #ffcdd2 !important;
        }
        .error-summary {
            margin-top: 10px;
            padding: 10px;
            background-color: #ffebee;
            border: 1px solid #ffcdd2;
            border-radius: 4px;
        }
        .error-summary h5 {
            color: #c62828;
            margin-bottom: 10px;
        }
        .error-summary ul {
            margin: 0;
            padding-left: 20px;
            columns: 2;
            column-gap: 20px;
        }
        .error-summary li {
            color: #c62828;
            margin-bottom: 5px;
        }
        .validation-results {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .nav-button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="d-flex justify-content-center gap-3">
        <a href="{{ url_for('index') }}" class="btn btn-primary">Preprocessing</a>
        <a href="{{ url_for('join') }}" class="btn btn-info">Join Files</a>
        <a href="{{ url_for('mapping.mapping_page') }}" class="btn btn-warning">Mapping</a>
        <a href="{{ url_for('calculation') }}" class="btn btn-success">Calculation</a>
    </div>
    <div class="container mt-5">
        
        <div class="main-content">
            <h2 class="mb-4">File Processor</h2>
            
            <div class="upload-area" id="dropZone">
                <p>Drag and drop your file here or click to select</p>
                <input type="file" id="fileInput" accept=".csv,.xlsx" class="hidden">
            </div>

            <div class="text-input-section">
                <label for="formatInput">Format Pattern (e.g., BC_#)</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="formatInput" placeholder="Enter format pattern...">
                    <button class="btn btn-primary" id="validateBtn" disabled>Validate Format</button>
                    <button class="btn btn-success" id="fixFormatBtn" disabled>Fix Format</button>
                </div>
            </div>

            <div id="fileInfo" class="hidden">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 id="fileName"></h4>
                    <button class="btn btn-primary" id="downloadBtn">Download</button>
                </div>
            </div>

            <div class="preview-area hidden" id="previewArea">
                <div class="validation-results">
                    <div id="errorSummary" class="error-summary hidden">
                        <h5>Format Errors Found:</h5>
                        <ul id="errorRowsList"></ul>
                    </div>
                    <div id="formatErrors" class="format-errors hidden">
                        <h5>Format Validation Details:</h5>
                        <ul id="errorsList"></ul>
                    </div>
                </div>
                <div class="split-view">
                    <div class="preview-section">
                        <h4 class="section-title">Data Preview</h4>
                        <div class="row-count" id="rowCount"></div>
                        <div class="preview-container">
                            <div class="table-responsive">
                                <table class="table" id="previewTable">
                                    <thead>
                                        <tr id="headerRow">
                                            <th class="row-number">#</th>
                                        </tr>
                                    </thead>
                                    <tbody id="dataRows"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="unique-values-section" id="uniqueValuesSection">
                        <h4 class="section-title">Unique Values</h4>
                        <div id="uniqueValuesList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
