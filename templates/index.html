<!DOCTYPE html>
<html lang="en">
<head>
    <script src="{{ url_for('static', filename='index.js') }}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Processor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
    <!-- You can add Font Awesome or another icon library for better icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="app-header">
        <div class="nav-container">
            <div class="nav-tabs">
                <a href="{{ url_for('index') }}" class="nav-tab preprocessing">
                    <i class="fas fa-cogs me-2"></i>Preprocessing
                </a>
                <a href="{{ url_for('join') }}" class="nav-tab join">
                    <i class="fas fa-link me-2"></i>Join Files
                </a>
                <a href="{{ url_for('mapping.mapping_page') }}" class="nav-tab mapping">
                    <i class="fas fa-map me-2"></i>Mapping
                </a>
                <a href="{{ url_for('calculation') }}" class="nav-tab calculation">
                    <i class="fas fa-calculator me-2"></i>Calculation
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <h2 class="page-title">File Preprocessing</h2>
            
            <div class="upload-area" id="dropZone">
                <div class="upload-icon">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <p>Drag and drop your file here or click to select</p>
                <p class="small text-muted">Supported formats: CSV, XLSX</p>
                <input type="file" id="fileInput" accept=".csv,.xlsx" class="hidden">
            </div>

            <div class="input-section">
                <label for="formatInput">Format Pattern (e.g., BC_#)</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="formatInput" placeholder="Enter format pattern...">
                    <button class="btn btn-primary" id="validateBtn" disabled>
                        <i class="fas fa-check me-1"></i>Validate Format
                    </button>
                    <button class="btn btn-success" id="fixFormatBtn" disabled>
                        <i class="fas fa-magic me-1"></i>Fix Format
                    </button>
                </div>
            </div>

            <div id="fileInfo" class="file-info hidden">
                <h4 id="fileName" class="file-name"></h4>
                <button class="btn btn-primary" id="downloadBtn">
                    <i class="fas fa-download me-1"></i>Download
                </button>
            </div>

            <div class="preview-area hidden" id="previewArea">
                <div class="validation-results">
                    <div id="errorSummary" class="error-summary hidden">
                        <h5><i class="fas fa-exclamation-triangle me-2"></i>Format Errors Found:</h5>
                        <ul id="errorRowsList"></ul>
                    </div>
                    <div id="formatErrors" class="format-errors hidden">
                        <h5><i class="fas fa-info-circle me-2"></i>Format Validation Details:</h5>
                        <ul id="errorsList"></ul>
                    </div>
                </div>
                <div class="split-view">
                    <div class="preview-section">
                        <h4 class="section-title">
                            <i class="fas fa-table me-2"></i>Data Preview
                        </h4>
                        <div class="row-count" id="rowCount"></div>
                        <div class="preview-container">
                            <div class="table-responsive">
                                <table class="table" id="previewTable">
                                    <thead>
                                        <tr id="headerRow">
                                            <th class="row-number">#</th>
                                        </tr>
                                    </thead>
                                    <tbody id="dataRows"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="unique-values-section" id="uniqueValuesSection">
                        <h4 class="section-title">
                            <i class="fas fa-fingerprint me-2"></i>Unique Values
                        </h4>
                        <div id="uniqueValuesList" class="unique-values-container"></div>
                    </div>
                </div>
            </div>
            
            <div class="nav-buttons mt-4">
                <button class="nav-back">
                    <i class="fas fa-arrow-left me-2"></i>Back
                </button>
                <button class="nav-next">
                    <i class="fas fa-arrow-right me-2"></i>Next
                </button>
            </div>
        </div>
    </div>
</body>
</html>
