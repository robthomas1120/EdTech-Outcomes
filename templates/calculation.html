<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculation Page</title>
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="app-header">
        <div class="nav-container">
            <div class="nav-tabs">
                <a href="{{ url_for('index') }}" class="nav-tab preprocessing">
                    <i class="fas fa-cogs me-2"></i>Preprocessing
                </a>
                <a href="{{ url_for('join') }}" class="nav-tab join">
                    <i class="fas fa-link me-2"></i>Join Files
                </a>
                <a href="{{ url_for('mapping.mapping_page') }}" class="nav-tab mapping">
                    <i class="fas fa-map me-2"></i>Mapping
                </a>
                <a href="{{ url_for('calculation') }}" class="nav-tab calculation">
                    <i class="fas fa-calculator me-2"></i>Calculation
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <h2 class="page-title">CSV Calculations</h2>
            
            <!-- File Upload Section -->
            <div class="section-card mb-4">
                <h3 class="section-title">
                    <i class="fas fa-file-upload me-2"></i>Upload CSV File
                </h3>
                <form id="uploadForm">
                    <div class="upload-area" id="calcDropZone">
                        <div class="upload-icon">
                            <i class="fas fa-table"></i>
                        </div>
                        <p>Drag and drop your CSV file here or click to select</p>
                        <p class="small text-muted">Supported format: CSV</p>
                        <input type="file" id="csvFile" name="csvFile" accept=".csv" class="hidden" required>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-upload me-2"></i>Upload
                        </button>
                    </div>
                </form>
            </div>

            <!-- Calculation Options Section -->
            <div id="calculationOptions" class="section-card mb-4 hidden">
                <h3 class="section-title">
                    <i class="fas fa-tasks me-2"></i>Select Calculations
                </h3>
                <div class="options-container">
                    <div class="option-item">
                        <input class="option-checkbox calc-option" type="checkbox" id="programsCheck" value="programs">
                        <label class="option-label" for="programsCheck">
                            Number of Programs/Departments
                        </label>
                    </div>
                    <div class="option-item">
                        <input class="option-checkbox calc-option" type="checkbox" id="studentsCheck" value="students">
                        <label class="option-label" for="studentsCheck">
                            Total Students
                        </label>
                    </div>
                    <div class="option-item">
                        <input class="option-checkbox calc-option" type="checkbox" id="ciloCountCheck" value="cilo_count">
                        <label class="option-label" for="ciloCountCheck">
                            Number of CILO's
                        </label>
                    </div>
                    <div class="option-item">
                        <input class="option-checkbox calc-option" type="checkbox" id="ciloNamesCheck" value="cilo_names">
                        <label class="option-label" for="ciloNamesCheck">
                            CILO Names
                        </label>
                    </div>
                </div>
                <div class="mt-3">
                    <button id="calculateBtn" class="btn btn-primary">
                        <i class="fas fa-calculator me-2"></i>Calculate
                    </button>
                </div>
            </div>

            <!-- Preview Section -->
            <div id="previewSection" class="section-card mb-4 hidden">
                <h3 class="section-title">
                    <i class="fas fa-eye me-2"></i>Preview
                </h3>
                <div id="previewContent" class="preview-container">
                    <!-- Preview content will be inserted here -->
                </div>
                <div class="mt-3">
                    <button id="appendBtn" class="btn btn-success">
                        <i class="fas fa-plus-circle me-2"></i>Append to CSV
                    </button>
                </div>
            </div>

            <!-- Status Messages -->
            <div id="statusMessage" class="status-message hidden" role="alert"></div>
        </div>
    </div>

    <script>
        // Initialize drag and drop for the calculation upload area
        const calcDropZone = document.getElementById('calcDropZone');
        const csvFile = document.getElementById('csvFile');
        
        // Open file dialog when clicking on the drop zone
        calcDropZone.addEventListener('click', () => {
            csvFile.click();
        });
        
        // Display file name when a file is selected
        csvFile.addEventListener('change', () => {
            if (csvFile.files.length > 0) {
                const fileName = csvFile.files[0].name;
                calcDropZone.querySelector('p').textContent = `Selected: ${fileName}`;
                calcDropZone.style.borderColor = 'var(--success-color)';
            }
        });
        
        // Handle drag and drop events
        calcDropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            calcDropZone.style.borderColor = 'var(--primary-color)';
            calcDropZone.style.backgroundColor = 'rgba(67, 97, 238, 0.05)';
        });
        
        calcDropZone.addEventListener('dragleave', () => {
            calcDropZone.style.borderColor = 'var(--medium-gray)';
            calcDropZone.style.backgroundColor = 'var(--secondary-color)';
        });
        
        calcDropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            calcDropZone.style.borderColor = 'var(--success-color)';
            calcDropZone.style.backgroundColor = 'var(--secondary-color)';
            
            if (e.dataTransfer.files.length > 0) {
                csvFile.files = e.dataTransfer.files;
                const fileName = csvFile.files[0].name;
                calcDropZone.querySelector('p').textContent = `Selected: ${fileName}`;
                
                // Trigger change event
                const event = new Event('change');
                csvFile.dispatchEvent(event);
            }
        });
    </script>
    <script src="{{ url_for('static', filename='calculation.js') }}"></script>
</body>
</html>
