<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculation Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='calculation.css') }}" rel="stylesheet">
</head>
<body>
    <div class="d-flex justify-content-center gap-3">
        <a href="{{ url_for('index') }}" class="btn btn-primary">Preprocessing</a>
        <a href="{{ url_for('calculation') }}" class="btn btn-success">Calculation</a>
        <a href="{{ url_for('join') }}" class="btn btn-info">Join Files</a>
        <a href="{{ url_for('mapping.mapping_page') }}" class="btn btn-warning">Mapping</a>
    </div>
    <div class="container mt-5">
        <h2>CSV Calculations</h2>
        
        <!-- File Upload Section -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Upload CSV File</h5>
                <form id="uploadForm">
                    <div class="mb-3">
                        <input type="file" class="form-control" id="csvFile" accept=".csv" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload</button>
                </form>
            </div>
        </div>

        <!-- Calculation Options Section -->
        <div id="calculationOptions" class="card mb-4 hidden">
            <div class="card-body">
                <h5 class="card-title">Select Calculations</h5>
                <div class="form-check mb-2">
                    <input class="form-check-input calc-option" type="checkbox" id="programsCheck" value="programs">
                    <label class="form-check-label" for="programsCheck">
                        Number of Programs/Departments
                    </label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input calc-option" type="checkbox" id="studentsCheck" value="students">
                    <label class="form-check-label" for="studentsCheck">
                        Total Students
                    </label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input calc-option" type="checkbox" id="ciloCountCheck" value="cilo_count">
                    <label class="form-check-label" for="ciloCountCheck">
                        Number of CILO's
                    </label>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input calc-option" type="checkbox" id="ciloNamesCheck" value="cilo_names">
                    <label class="form-check-label" for="ciloNamesCheck">
                        CILO Names
                    </label>
                </div>
                <button id="calculateBtn" class="btn btn-primary">Calculate</button>
            </div>
        </div>

        <!-- Preview Section -->
        <div id="previewSection" class="card mb-4 hidden">
            <div class="card-body">
                <h5 class="card-title">Preview</h5>
                <div id="previewContent" class="preview-container">
                    <!-- Preview content will be inserted here -->
                </div>
                <button id="appendBtn" class="btn btn-success mt-3">Append to CSV</button>
            </div>
        </div>

        <!-- Status Messages -->
        <div id="statusMessage" class="alert hidden" role="alert"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='calculation.js') }}"></script>
</body>
</html>
